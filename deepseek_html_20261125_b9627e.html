<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Luxury Cars — Catálogo e Admin</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Oswald:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <style>
        :root {
            --bg-primary: #0f0f12; --bg-secondary: #1a1a1f; --bg-tertiary: #252530;
            --text-primary: #f5f5f5; --text-secondary: #a0a0a8; --gold: #d4af37;
            --border: #3a3a42; --danger: #ef4444;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background: var(--bg-primary); color: var(--text-primary); line-height: 1.6; }
        .container { max-width: 1280px; margin: 0 auto; padding: 0 20px; }
        
        header { background: rgba(15, 15, 18, 0.8); border-bottom: 1px solid var(--border); padding: 16px 0; position: sticky; top: 0; z-index: 50; backdrop-filter: blur(10px); }
        .header-content { display: flex; justify-content: space-between; align-items: center; }
        .logo { display: flex; align-items: center; gap: 12px; text-decoration: none; color: var(--text-primary); }
        .logo-icon { width: 40px; height: 40px; background: linear-gradient(135deg, var(--gold) 0%, #c9a227 100%); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: bold; color: #000; }
        .logo-text { font-family: 'Oswald', sans-serif; font-size: 20px; font-weight: 700; letter-spacing: 2px; }
        .nav-links a { color: var(--text-primary); text-decoration: none; font-size: 14px; font-weight: 500; margin-left: 20px; transition: color 0.3s; }
        .nav-links a:hover { color: var(--gold); }

        .section-label { color: var(--gold); font-family: 'Oswald', sans-serif; font-size: 12px; letter-spacing: 3px; text-transform: uppercase; margin-bottom: 10px; }
        .section-title { font-family: 'Oswald', sans-serif; font-size: 36px; font-weight: 700; letter-spacing: 1px; margin-bottom: 30px; }

        .admin-box { background: var(--bg-secondary); border: 1px solid var(--border); border-radius: 12px; padding: 30px; margin-bottom: 50px; margin-top: 40px; }
        .form-label { color: var(--text-secondary); font-size: 13px; font-weight: 600; }
        .form-control, .form-select { background: var(--bg-tertiary); border: 1px solid var(--border); color: var(--text-primary); }
        .form-control:focus, .form-select:focus { background: var(--bg-tertiary); color: var(--text-primary); border-color: var(--gold); box-shadow: 0 0 0 3px rgba(212, 175, 55, 0.15); }
        .btn-gold { background: linear-gradient(135deg, var(--gold) 0%, #c9a227 100%); color: #000; border: none; font-weight: 700; padding: 10px 24px; border-radius: 8px; transition: 0.3s; }
        .btn-gold:hover { opacity: 0.8; color: #000; }

        .table-custom { background: var(--bg-secondary); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; }
        .table-custom thead { background: var(--bg-tertiary); }
        .table-custom th { color: var(--gold); font-family: 'Oswald', sans-serif; letter-spacing: 1px; padding: 16px; border-bottom: 1px solid var(--border); }
        .table-custom td { color: var(--text-primary); padding: 14px 16px; border-bottom: 1px solid var(--border); vertical-align: middle; }

        .catalog-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; margin-bottom: 60px; }
        .car-card { background: var(--bg-secondary); border: 1px solid var(--border); border-radius: 12px; padding: 24px; transition: 0.3s; }
        .car-card:hover { border-color: var(--gold); transform: translateY(-3px); }
        .car-brand { color: var(--gold); font-size: 12px; font-weight: 600; letter-spacing: 1px; text-transform: uppercase; margin-bottom: 8px; }
        .car-model { font-family: 'Oswald', sans-serif; font-size: 22px; margin-bottom: 8px; }
        .car-year { font-size: 13px; color: var(--text-secondary); margin-bottom: 16px; }
        .car-price { font-family: 'Oswald', sans-serif; font-size: 24px; color: var(--gold); font-weight: 700; border-top: 1px solid var(--border); padding-top: 16px; }

        .modal-content { background: var(--bg-secondary); border: 1px solid var(--border); border-radius: 12px; }
        .modal-header { border-bottom: 1px solid var(--border); }
        .modal-header h5 { font-family: 'Oswald', sans-serif; color: var(--gold); }
        .btn-close { filter: invert(1); }
    </style>
</head>
<body>

    <header>
        <div class="container header-content">
            <a href="#" class="logo">
                <div class="logo-icon">🚗</div>
                <div class="logo-text">LUXURY CARS</div>
            </a>
            <nav class="nav-links">
                <a href="#catalogo">Catálogo</a>
                <a href="#admin">Área Admin</a>
            </nav>
        </div>
    </header>

    <div class="container mt-5">
        
        <!-- PAINEL ADMINISTRATIVO -->
        <div id="admin">
            <p class="section-label">Painel do Administrador</p>
            <h2 class="section-title">Cadastrar Novo Veículo</h2>
            
            <div class="admin-box">
                <form id="carForm">
                    <div class="row g-3">
                        <div class="col-md-3">
                            <label class="form-label">Marca</label>
                            <input type="text" class="form-control" id="marca" placeholder="Ex: Ferrari" required>
                        </div>
                        <div class="col-md-3">
                            <label class="form-label">Modelo</label>
                            <input type="text" class="form-control" id="modelo" placeholder="Ex: Roma" required>
                        </div>
                        <div class="col-md-2">
                            <label class="form-label">Ano</label>
                            <input type="number" class="form-control" id="ano" placeholder="2024" required>
                        </div>
                        <div class="col-md-2">
                            <label class="form-label">Preço (R$)</label>
                            <input type="number" step="0.01" class="form-control" id="preco" placeholder="0.00" required>
                        </div>
                        <div class="col-md-2">
                            <label class="form-label">Categoria</label>
                            <select class="form-select" id="categoria" required>
                                <option value="">Escolha...</option>
                                <option value="Esportivo">Esportivo</option>
                                <option value="Sedan">Sedan</option>
                                <option value="SUV">SUV</option>
                                <option value="Luxo">Luxo</option>
                            </select>
                        </div>
                    </div>
                    <button type="submit" class="btn btn-gold mt-4">Enviar para o Firebase</button>
                </form>
            </div>

            <h4 class="mb-3" style="font-family: 'Oswald', sans-serif; color: var(--gold);">Gerenciar Dados</h4>
            <div class="table-custom mb-5">
                <table class="table mb-0">
                    <thead>
                        <tr>
                            <th>Marca</th>
                            <th>Modelo</th>
                            <th>Ano</th>
                            <th>Preço</th>
                            <th>Ações</th>
                        </tr>
                    </thead>
                    <tbody id="tabelaCarros">
                        <!-- Preenchido via JS -->
                    </tbody>
                </table>
            </div>
        </div>

        <!-- CATÁLOGO VISUAL -->
        <div id="catalogo">
            <p class="section-label">Veículos Disponíveis</p>
            <h2 class="section-title">Catálogo de Carros</h2>
            <div class="catalog-grid" id="catalogoCarros">
                <!-- Preenchido via JS -->
            </div>
        </div>

    </div>

    <!-- MODAL DE EDIÇÃO -->
    <div class="modal fade" id="modalEditar" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Editar Carro</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="editarForm">
                        <div class="row g-3">
                            <div class="col-md-6">
                                <label class="form-label">Marca</label>
                                <input type="text" class="form-control" id="editarMarca" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Modelo</label>
                                <input type="text" class="form-control" id="editarModelo" required>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label">Ano</label>
                                <input type="number" class="form-control" id="editarAno" required>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label">Preço</label>
                                <input type="number" step="0.01" class="form-control" id="editarPreco" required>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label">Categoria</label>
                                <select class="form-select" id="editarCategoria" required>
                                    <option value="Esportivo">Esportivo</option>
                                    <option value="Sedan">Sedan</option>
                                    <option value="SUV">SUV</option>
                                    <option value="Luxo">Luxo</option>
                                </select>
                            </div>
                        </div>
                        <button type="submit" class="btn btn-gold w-100 mt-4">Salvar Alterações</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    
    <!-- ÚNICO ARQUIVO JS -->
    <script type="module" src="script.js"></script>
</body>
</html>
